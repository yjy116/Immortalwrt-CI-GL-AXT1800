name: Cache-Clean

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "Preview only. Set false to delete matching caches."
        default: true
        required: true
        type: boolean
      KEY_PREFIX:
        description: "Delete caches whose keys start with this prefix."
        default: "AXT1800-"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  clean:
    name: Clean build caches
    runs-on: ubuntu-latest
    steps:
      - name: List or delete matching caches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.DRY_RUN }}
          KEY_PREFIX: ${{ inputs.KEY_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEY_PREFIX" ]; then
            echo "::error::KEY_PREFIX cannot be empty."
            exit 1
          fi

          caches="$RUNNER_TEMP/caches.json"
          gh cache list --key "$KEY_PREFIX" --limit 100 \
            --json id,key,sizeInBytes,lastAccessedAt \
            > "$caches"

          count="$(jq 'length' "$caches")"
          size_bytes="$(jq '[.[].sizeInBytes] | add // 0' "$caches")"
          size_mib="$(awk -v bytes="$size_bytes" 'BEGIN { printf "%.1f", bytes / 1024 / 1024 }')"

          {
            echo "## Cache clean"
            echo
            echo "- Prefix: \`$KEY_PREFIX\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Matching caches: \`$count\`"
            echo "- Matching size: \`$size_mib MiB\`"
            echo
            echo "| id | key | size MiB | last accessed |"
            echo "| --- | --- | ---: | --- |"
            jq -r '.[] | "| \(.id) | `\(.key)` | \((.sizeInBytes / 1024 / 1024 * 10 | round) / 10) | \(.lastAccessedAt) |"' "$caches"
          } | tee "$GITHUB_STEP_SUMMARY"

          if [ "$count" -eq 0 ]; then
            echo "No matching caches."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run only. Re-run with DRY_RUN=false to delete these caches."
            exit 0
          fi

          jq -r '.[].id' "$caches" | while read -r cache_id; do
            echo "Deleting cache id: $cache_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}" >/dev/null
          done
